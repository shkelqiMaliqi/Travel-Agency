services:
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "ChangeThisDockerSecretToARealLongRandomValue123!"
      Jwt__Issuer: "TravelAgency.Api"
      Jwt__Audience: "TravelAgency.Client"
      ConnectionStrings__CRUDCS: "Server=sqlserver,1433;Database=Travel_Agency;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__ConnectionString: "amqp://travelagency:travelagency-pass@rabbitmq:5672"
      RabbitMq__MfaQueue: "travel-agency.mfa.delivery"
      Security__ExposeMfaCodeInResponse: "false"
      Email__Smtp__Host: ""
      Email__Smtp__Port: "587"
      Email__Smtp__Username: ""
      Email__Smtp__Password: ""
      Email__Smtp__From: "no-reply@travel-agency.local"
      Email__Smtp__EnableSsl: "true"
      Mongo__ConnectionString: "mongodb://mongo:27017"
      Storage__S3__ServiceUrl: "http://minio:9000"
      Storage__S3__AccessKey: "minioadmin"
      Storage__S3__SecretKey: "minioadmin"
      Alerting__SlackWebhookUrl: ""
      Alerting__Email__SmtpHost: ""
      Alerting__Email__To: ""
      Logging__Logstash__Host: "logstash"
      Logging__Logstash__Port: "5044"
    depends_on:
      - sqlserver
      - redis
      - rabbitmq
      - mongo
      - minio
      - logstash

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "ChangeThisDockerSecretToARealLongRandomValue123!"
      Jwt__Issuer: "TravelAgency.Api"
      Jwt__Audience: "TravelAgency.Client"
      ConnectionStrings__CRUDCS: "Server=sqlserver,1433;Database=Travel_Agency;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__ConnectionString: "amqp://travelagency:travelagency-pass@rabbitmq:5672"
      RabbitMq__MfaQueue: "travel-agency.mfa.delivery"
      Security__ExposeMfaCodeInResponse: "false"
      Email__Smtp__Host: ""
      Email__Smtp__Port: "587"
      Email__Smtp__Username: ""
      Email__Smtp__Password: ""
      Email__Smtp__From: "no-reply@travel-agency.local"
      Email__Smtp__EnableSsl: "true"
      Mongo__ConnectionString: "mongodb://mongo:27017"
      Storage__S3__ServiceUrl: "http://minio:9000"
      Storage__S3__AccessKey: "minioadmin"
      Storage__S3__SecretKey: "minioadmin"
      Alerting__SlackWebhookUrl: ""
      Alerting__Email__SmtpHost: ""
      Alerting__Email__To: ""
      Logging__Logstash__Host: "logstash"
      Logging__Logstash__Port: "5044"
    depends_on:
      - sqlserver
      - redis
      - rabbitmq
      - mongo
      - minio
      - logstash

  notification-service:
    build:
      context: .
      dockerfile: Microservices/NotificationService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__ConnectionString: "amqp://travelagency:travelagency-pass@rabbitmq:5672"
      RabbitMq__MfaQueue: "travel-agency.mfa.delivery"
      Email__Smtp__Host: ""
      Email__Smtp__Port: "587"
      Email__Smtp__Username: ""
      Email__Smtp__Password: ""
      Email__Smtp__From: "no-reply@travel-agency.local"
      Email__Smtp__EnableSsl: "true"
    depends_on:
      - rabbitmq

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./Infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./Infrastructure/backups/output:/var/opt/mssql/backup

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "travelagency"
      RABBITMQ_DEFAULT_PASS: "travelagency-pass"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    volumes:
      - ./Infrastructure/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch

  sqlserver-backup:
    image: mcr.microsoft.com/mssql-tools
    environment:
      SQLSERVER_HOST: "sqlserver"
      SQLSERVER_DATABASE: "Travel_Agency"
      SQLSERVER_USER: "sa"
      SQLSERVER_PASSWORD: "YourStrong!Passw0rd"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - ./Infrastructure/backups:/backups
    command: ["/bin/bash", "/backups/sqlserver-backup.sh"]
    depends_on:
      - sqlserver

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    volumes:
      - ./Infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./Infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--config.expand-env"
    environment:
      ALERT_EMAIL_TO: "alerts@example.com"
      ALERT_EMAIL_FROM: "alerts@travel-agency.local"
      ALERT_SMTP_HOST: "localhost:25"
      ALERT_SMTP_AUTH_USERNAME: ""
      ALERT_SMTP_AUTH_PASSWORD: ""
      ALERT_SLACK_WEBHOOK_URL: "http://127.0.0.1:9/disabled-alert-webhook"
    volumes:
      - ./Infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  sqlserver-data:
  rabbitmq-data:
  mongo-data:
  minio-data:
