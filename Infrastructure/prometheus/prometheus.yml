global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "travel-agency-api"
    metrics_path: /metrics
    static_configs:
        - targets: ["api1:8080", "api2:8080"]

rule_files:
  - /etc/prometheus/alerts.yml
