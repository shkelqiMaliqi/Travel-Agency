groups:
  - name: travel-agency-api
    rules:
      - alert: TravelAgencyApiDown
        expr: up{job="travel-agency-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: travel-agency-api
        annotations:
          summary: "Travel Agency API is down"
          description: "Prometheus cannot scrape the Travel Agency API through the gateway."

      - alert: TravelAgencyHighErrorRate
        expr: sum(rate(http_requests_received_total{code=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: travel-agency-api
        annotations:
          summary: "Travel Agency API is returning server errors"
          description: "The API has returned at least one 5xx response during the last five minutes."
