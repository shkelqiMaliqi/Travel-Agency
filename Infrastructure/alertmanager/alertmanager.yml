route:
  receiver: "production-alerts"
  group_by: ["alertname", "service"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 1h

receivers:
  - name: "production-alerts"
    email_configs:
      - to: "alerts@example.com"
        from: "alerts@travel-agency.local"
        smarthost: "localhost:25"
        auth_username: ""
        auth_password: ""
        require_tls: false
        send_resolved: true
    webhook_configs:
      - url: "http://127.0.0.1:9/disabled-alert-webhook"
        send_resolved: true
