route:
  receiver: "production-alerts"
  group_by: ["alertname", "service"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 1h

receivers:
  - name: "production-alerts"
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        from: "${ALERT_EMAIL_FROM}"
        smarthost: "${ALERT_SMTP_HOST}"
        auth_username: "${ALERT_SMTP_AUTH_USERNAME}"
        auth_password: "${ALERT_SMTP_AUTH_PASSWORD}"
        require_tls: false
        send_resolved: true
    webhook_configs:
      - url: "${ALERT_SLACK_WEBHOOK_URL}"
        send_resolved: true
