apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-agency-frontend
  namespace: travel-agency
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-agency-frontend
  template:
    metadata:
      labels:
        app: travel-agency-frontend
    spec:
      containers:
        - name: frontend
          image: travel-agency-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: API_UPSTREAM
              value: travel-agency-api
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: frontend.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
      volumes:
        - name: nginx-config
          configMap:
            name: travel-agency-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: travel-agency-frontend
  namespace: travel-agency
spec:
  selector:
    app: travel-agency-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
