apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: travel-agency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travel-agency-secrets
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: data-volume
              mountPath: /var/opt/mssql
            - name: backup-volume
              mountPath: /var/opt/mssql/backup
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: sqlserver-data
        - name: backup-volume
          persistentVolumeClaim:
            claimName: sqlserver-backups
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: travel-agency
spec:
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-data
  namespace: travel-agency
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-backups
  namespace: travel-agency
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
