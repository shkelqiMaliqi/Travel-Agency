apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: travel-agency
spec:
  replicas: 1
  selector:
    matchLabels: {app: mailpit}
  template:
    metadata:
      labels: {app: mailpit}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.33.1
          ports:
            - containerPort: 1025
            - containerPort: 8025
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: travel-agency
spec:
  selector: {app: mailpit}
  ports:
    - {name: smtp, port: 1025, targetPort: 1025}
    - {name: inbox, port: 8025, targetPort: 8025}
