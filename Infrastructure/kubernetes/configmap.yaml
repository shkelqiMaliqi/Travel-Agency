apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-agency-config
  namespace: travel-agency
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "TravelAgency.Api"
  Jwt__Audience: "TravelAgency.Client"
  Security__MfaRequiredRoles: "admin,auditor"
  Security__ExposeMfaCodeInResponse: "false"
  Redis__ConnectionString: "redis:6379"
  RabbitMq__MfaQueue: "travel-agency.mfa.delivery"
  Mongo__ConnectionString: "mongodb://mongo:27017"
  Mongo__Database: "travel_agency"
  Mongo__AnalyticsCollection: "analytics_events"
  Storage__S3__ServiceUrl: "http://minio:9000"
  Storage__S3__Bucket: "travel-agency-files"
  Logging__Logstash__Host: ""
  Logging__Logstash__Port: "5044"
  Email__Smtp__Host: "mailpit"
  Email__Smtp__Port: "1025"
  Email__Smtp__From: "no-reply@travel-agency.local"
  Email__Smtp__EnableSsl: "false"
