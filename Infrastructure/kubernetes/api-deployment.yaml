apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-agency-api
  namespace: travel-agency
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-agency-api
  template:
    metadata:
      labels:
        app: travel-agency-api
    spec:
      containers:
        - name: api
          image: travel-agency-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: travel-agency-config
            - secretRef:
                name: travel-agency-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: travel-agency-api
  namespace: travel-agency
spec:
  type: ClusterIP
  selector:
    app: travel-agency-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
