apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-agency-api
  namespace: travel-agency
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-agency-api
  template:
    metadata:
      labels:
        app: travel-agency-api
    spec:
      containers:
        - name: api
          image: travel-agency-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: travel-agency-config
            - secretRef:
                name: travel-agency-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
---
apiVersion: v1
kind: Service
metadata:
  name: travel-agency-api
  namespace: travel-agency
spec:
  type: ClusterIP
  selector:
    app: travel-agency-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
